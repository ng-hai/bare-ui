name: Smoke

# Installs a real component through the shadcn CLI's GitHub resolution path
# and typechecks the result — what consumers actually do. Runs against the
# pushed commit on main, and weekly to catch shadcn CLI regressions.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: ./scripts/registry-smoke.sh "$GITHUB_SHA"
