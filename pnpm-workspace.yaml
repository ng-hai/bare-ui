# pnpm 11 build-script approval. Both packages work without their install
# scripts (the full test/typecheck/registry suite passes with them skipped),
# so neither is built. Flip to `true` only if a script becomes required.
allowBuilds:
  esbuild: false
  msw: false
minimumReleaseAgeExclude:
  - '@base-ui/react@1.8.0'
  - '@base-ui/utils@0.4.0'
